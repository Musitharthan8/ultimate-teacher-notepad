# Template for setting up an MSYS2 environment on Windows

name: Install dependencies for Windows build
inputs:
  msystem:
    required: true
    type: string
  msys_package_env:
    required: true
    type: string

runs:
  using: composite
  steps:
    - uses: msys2/setup-msys2@v2
      with:
        msystem: ${{inputs.msystem}}
        update: true
        install: >-
          mingw-w64-${{inputs.msys_package_env}}-toolchain
          mingw-w64-${{inputs.msys_package_env}}-cmake
          mingw-w64-${{inputs.msys_package_env}}-make
          mingw-w64-${{inputs.msys_package_env}}-ninja
          mingw-w64-${{inputs.msys_package_env}}-gettext
          mingw-w64-${{inputs.msys_package_env}}-poppler
          mingw-w64-${{inputs.msys_package_env}}-gtk3
          mingw-w64-${{inputs.msys_package_env}}-libsndfile
          mingw-w64-${{inputs.msys_package_env}}-libzip
          mingw-w64-${{inputs.msys_package_env}}-portaudio
          mingw-w64-${{inputs.msys_package_env}}-lua
          mingw-w64-${{inputs.msys_package_env}}-imagemagick
          make
          mingw-w64-${{inputs.msys_package_env}}-gobject-introspection-runtime
          mingw-w64-${{inputs.msys_package_env}}-lua-luarocks
          mingw-w64-${{inputs.msys_package_env}}-zstd
    - shell: msys2 {0}
      run: |
        set -euo pipefail
        # TeX syntax highlighting is optional. MINGW64 no longer consistently
        # publishes GtkSourceView 4; do not block the entire installer on it.
        sourceview_package=mingw-w64-${{inputs.msys_package_env}}-gtksourceview4
        if pacman -Si "$sourceview_package" >/dev/null 2>&1; then
          pacman --noconfirm -S --needed "$sourceview_package"
        else
          echo '::notice::GtkSourceView 4 unavailable; build will use the plain TeX editor.'
        fi
        qpdf_package=mingw-w64-${{inputs.msys_package_env}}-qpdf
        if pacman -Si "$qpdf_package" >/dev/null 2>&1; then
          pacman --noconfirm -S --needed "$qpdf_package"
        else
          echo '::notice::QPDF unavailable; build will use Cairo PDF export.'
        fi
        # install LuaGObject via luarocks as long as there is no MinGW package
        # If this command fails because of a new Lua version, update package.sh as well
        luarocks install --lua-version=5.5 LuaGObject

