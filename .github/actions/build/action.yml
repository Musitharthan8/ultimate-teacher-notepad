# Template for building Xournal++

name: Build xournal++
inputs:
  build_type:
    required: true
    type: string
  cmake_flags:
    default: '-DENABLE_GTEST=ON -DDOWNLOAD_GTEST=on'
    type: string
    required: false
  extra_cmake_flags:
    default: ''
    type: string
    required: false
  cmake_commands:
    default: ''
    type: string
    required: false
  shell:
    default: bash
    required: false

runs:
  using: composite
  steps:
  - name: 'Create build directory'
    shell: ${{inputs.shell}}
    run: mkdir build
  - name: 'Build Xournal++'
    shell: ${{inputs.shell}}
    working-directory: ${{github.workspace}}/build
    run: |
      which pkg-config
      pkg-config --version
      optional_cmake_flags=()
      if [[ "${RUNNER_OS:-}" == Windows ]] && ! pkg-config --exists gtksourceview-4; then
        optional_cmake_flags+=(-DENABLE_GTK_SOURCEVIEW=OFF)
      fi
      if [[ "${RUNNER_OS:-}" == Windows ]] && ! pkg-config --exists libqpdf; then
        optional_cmake_flags+=(-DENABLE_QPDF=OFF)
      fi
      cmake -GNinja .. -DCMAKE_BUILD_TYPE=${{ inputs.build_type }} ${{ inputs.cmake_flags }} ${{ inputs.extra_cmake_flags }} "${optional_cmake_flags[@]}"
      # Make sure pot is up to date with sources (maybe translation pipeline is currently running)
      cmake --build . --target pot
      cmake --build . --target translations
      # Build Xournal++
      cmake --build . ${{ inputs.cmake_commands }}
