name: UTN Windows Build

on:
  push:
    branches:
      - utn-dev
      - "feature/**"
  pull_request:
    branches:
      - utn-dev

env:
  BUILD_TYPE: Debug

# UTN feature work moves quickly. Only the newest build for a branch matters.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 60
    name: Build UTN on Windows x86_64

    steps:
      - uses: actions/checkout@v6

      - name: Install dependencies
        uses: ./.github/actions/install_deps_windows
        with:
          msystem: mingw64
          msys_package_env: x86_64

      - name: Build UTN
        uses: ./.github/actions/build
        with:
          build_type: ${{ env.BUILD_TYPE }}
          shell: msys2 {0}

      - name: Build reliability tests
        shell: msys2 {0}
        run: cmake --build . --target test-units test-gtk-integration test-lock-audit
        working-directory: ${{ github.workspace }}/build

      - name: Run unit tests
        id: units
        shell: msys2 {0}
        run: set -o pipefail; CI=true ./test/test-units --gtest_output=xml:unit-tests.xml 2>&1 | tee unit-tests.log
        working-directory: ${{ github.workspace }}/build

      - name: Run GTK integration tests
        if: ${{ !cancelled() && success() }}
        shell: msys2 {0}
        run: set -o pipefail; CI=true ./test/test-gtk-integration --gtest_output=xml:gtk-tests.xml 2>&1 | tee gtk-tests.log
        working-directory: ${{ github.workspace }}/build

      - name: Run opt-in lock diagnostics tests
        if: ${{ !cancelled() && success() }}
        shell: msys2 {0}
        run: set -o pipefail; CI=true ./test/test-lock-audit --gtest_output=xml:lock-audit-tests.xml 2>&1 | tee lock-audit-tests.log
        working-directory: ${{ github.workspace }}/build

      - name: Require complete test execution
        shell: pwsh
        run: ./scripts/check-m1-test-results.ps1 -Reports build/unit-tests.xml,build/gtk-tests.xml,build/lock-audit-tests.xml

      - name: Package standalone Windows test build
        shell: msys2 {0}
        run: bash windows-setup/package-utn.sh build --portable-only

      - name: Validate extracted portable build without MSYS2
        shell: pwsh
        run: ./scripts/test-utn-portable.ps1 -PackageDirectory build/utn-release -ExpectedCommit '${{ github.sha }}'

      - name: Upload validated Windows test build
        id: portable
        uses: actions/upload-artifact@v4
        with:
          name: UTN-Windows-x64-test-${{ github.sha }}
          path: build/utn-release/*
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Link downloadable test build
        shell: pwsh
        run: |
          @'
          ## Windows test build
          [Download portable ZIP and checksums](${{ steps.portable.outputs.artifact-url }})
          Extract the artifact, then extract the Portable.zip inside it. Run bin/UTN.exe.
          No MSYS2 installation is required. This is an unsigned Debug test build, not a published release.
          '@ | Add-Content $env:GITHUB_STEP_SUMMARY

      - name: Preserve reliability evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-reliability-${{ github.sha }}
          path: |
            build/*-tests.xml
            build/*-tests.log
            build/utn-release/portable-smoke.log
          if-no-files-found: warn

      - name: Report failing unit tests
        if: ${{ failure() && steps.units.outcome == 'failure' }}
        shell: msys2 {0}
        run: |
          grep -E '\[  FAILED  \]' unit-tests.log | head -10 | while IFS= read -r l; do echo "::error title=failed test::$l"; done
          grep -E ': Failure|Expected|Which is|Actual' unit-tests.log | head -20 | while IFS= read -r l; do echo "::error title=assertion::$l"; done
        working-directory: ${{ github.workspace }}/build
