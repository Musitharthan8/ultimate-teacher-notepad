name: UTN Windows Installer
on:
  push:
    branches: [feature/utn-shell, utn-dev]
  workflow_dispatch:
concurrency:
  group: utn-windows-installer-${{ github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-2022
    name: Build and package UTN Windows beta
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/install_deps_windows
        with:
          msystem: mingw64
          msys_package_env: x86_64
      - name: Install packaging tools
        shell: pwsh
        run: choco install nsis --yes --no-progress
      - uses: ./.github/actions/build
        with:
          build_type: Release
          extra_cmake_flags: -DUTN_REQUIRE_PATCHED_LIBZIP=ON
          shell: msys2 {0}
      - name: Build and run unit tests
        shell: msys2 {0}
        working-directory: build
        run: |
          cmake --build . --target test-units
          CI=true ./test/test-units
      - name: Package installer and portable ZIP
        shell: msys2 {0}
        run: bash windows-setup/package-utn.sh build
      - name: Install and launch without MSYS2 on PATH
        shell: pwsh
        run: |
          $env:PATH = "$env:SystemRoot\system32;$env:SystemRoot"
          $installer = (Get-ChildItem build\utn-release\*-Setup.exe).FullName
          $installDir = Join-Path $env:RUNNER_TEMP 'UTN clean install'
          $setup = Start-Process $installer -ArgumentList "/S /D=$installDir" -WindowStyle Hidden -Wait -PassThru
          if ($setup.ExitCode -ne 0) { throw "Installer failed: $($setup.ExitCode)" }
          if (!(Test-Path "$installDir\bin\UTN.exe")) { throw 'UTN launcher missing' }
          $exe = Join-Path $installDir 'bin\xournalpp.exe'
          $version = Start-Process $exe -ArgumentList '--version' -WindowStyle Hidden -Wait -PassThru
          if ($version.ExitCode -ne 0) { throw "Packaged runtime failed: $($version.ExitCode)" }
          $fixture = (Resolve-Path 'test\files\packaged_xopp\text.xopp').Path
          $pdf = Join-Path $env:RUNNER_TEMP 'UTN smoke export.pdf'
          $export = Start-Process $exe -ArgumentList "--create-pdf=`"$pdf`" `"$fixture`"" -WindowStyle Hidden -Wait -PassThru
          if ($export.ExitCode -ne 0 -or !(Test-Path $pdf)) { throw 'Packaged PDF export failed' }
          if ((Get-Item $pdf).Length -lt 100 -or [Text.Encoding]::ASCII.GetString([IO.File]::ReadAllBytes($pdf), 0, 5) -ne '%PDF-') {
            throw 'Packaged PDF export produced an invalid file'
          }
          $png = Join-Path $env:RUNNER_TEMP 'UTN smoke export.png'
          $export = Start-Process $exe -ArgumentList "--create-img=`"$png`" --export-png-width=800 `"$fixture`"" -WindowStyle Hidden -Wait -PassThru
          $images = @(Get-ChildItem $env:RUNNER_TEMP -Filter 'UTN smoke export*.png')
          if ($export.ExitCode -ne 0 -or $images.Count -eq 0) { throw 'Packaged image export failed' }
          foreach ($image in $images) {
            $signature = [BitConverter]::ToString([IO.File]::ReadAllBytes($image.FullName), 0, 8)
            if ($signature -ne '89-50-4E-47-0D-0A-1A-0A') { throw 'Packaged image export produced an invalid PNG' }
          }
          $app = Start-Process $exe -PassThru
          try {
            $opened = $false
            for ($i = 0; $i -lt 30; $i++) {
              Start-Sleep -Seconds 1
              $app.Refresh()
              if ($app.HasExited) { throw "UTN exited during startup: $($app.ExitCode)" }
              if ($app.MainWindowHandle -ne 0) { $opened = $true; break }
            }
            if (!$opened) { throw 'UTN did not open a window' }
          } finally {
            if (!$app.HasExited) { Stop-Process -Id $app.Id -Force }
          }
          $uninstall = Start-Process "$installDir\Uninstall.exe" -ArgumentList '/S' -WindowStyle Hidden -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw 'Uninstaller failed' }
          if (Test-Path "$installDir\bin\UTN.exe") { throw 'Uninstaller left the launcher behind' }
      - uses: actions/upload-artifact@v4
        with:
          name: UTN-Windows-x64-${{ github.sha }}
          path: build/utn-release/*
          if-no-files-found: error
          retention-days: 30
